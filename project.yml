name: Subwave
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Subwave:
    type: application
    platform: iOS
    sources:
      - path: Subwave
      - path: Shared
    dependencies:
      - target: SubwaveWidget
    info:
      path: Subwave/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Subwave
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.soum91.subwave.refresh]
        NSLocalNetworkUsageDescription: Subwave talks to your sound bar, IR blaster, TV and the Afterglow bridge directly over Wi-Fi.
        NSBonjourServices: [_googlecast._tcp, _viziocast._tcp, _afterglow._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: Subwave saves the Smart Life login QR to Photos so you can pick it from Smart Life's scanner.
        LSApplicationQueriesSchemes: [smartlife, tuyasmart]
        CFBundleURLTypes:
          - CFBundleURLName: com.soum91.subwave
            CFBundleURLSchemes: [subwave]
    entitlements:
      path: Subwave/Subwave.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soum91.subwave]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.subwave
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  SubwaveWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SubwaveWidget
      - path: Shared
    info:
      path: SubwaveWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Subwave
        NSLocalNetworkUsageDescription: Subwave talks to your sound bar directly over Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SubwaveWidget/SubwaveWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soum91.subwave]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.subwave.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
